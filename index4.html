<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login 💖</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;}

.login-card{
  position:relative;z-index:1;text-align:center;
  max-width:420px;width:90%;
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--glass-borda);border-radius:var(--radius-card);
  box-shadow:var(--sombra);padding:44px 36px;
  animation:surgir 1.2s cubic-bezier(.22,1,.36,1) both;
}
.login-card::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:60%;height:3px;
  background:linear-gradient(90deg,transparent,var(--amarelo),transparent);border-radius:50%;
}
@keyframes surgir{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}

.pokemon-gif{
  width:150px;margin-bottom:18px;
  animation:flutuar 3s ease-in-out infinite;
  filter:drop-shadow(0 6px 14px rgba(74,55,40,.20));
}
@keyframes flutuar{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

h1{font-size:1.9rem;margin-bottom:6px;}
.subtitulo{font-size:.95rem;color:var(--text-suave);margin-bottom:28px;text-align:center;}

/* inputs */
.input-wrap{position:relative;margin-bottom:16px;}
.input-wrap input{
  width:100%;padding:14px 50px 14px 18px;
  border:2px solid rgba(246,201,78,.4);border-radius:50px;
  outline:none;font-family:'Nunito',sans-serif;font-size:.95rem;
  background:rgba(255,253,245,.75);color:var(--text);
  transition:border-color .2s;
}
.input-wrap input:focus{border-color:var(--amarelo);}
.input-wrap input::placeholder{color:var(--text-suave);}
.input-wrap .icone-input{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:1.2rem;cursor:pointer;user-select:none;
}

.btn-login{
  width:100%;padding:14px;border:none;border-radius:var(--radius-btn);
  background:linear-gradient(135deg,var(--amarelo),var(--rosa));
  color:var(--text);font-family:'Nunito',sans-serif;
  font-weight:700;font-size:1rem;cursor:pointer;
  box-shadow:0 6px 18px rgba(246,201,78,.35);
  transition:transform .2s,box-shadow .2s;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(246,201,78,.45);}
</style>
</head>
<body>

<div class="login-card">
  <img src="charizard.gif" class="pokemon-gif" alt="Charizard"/>
  <h1>Login 💖</h1>
  <p class="subtitulo">Descubra a senha secreta 👀</p>

  <div class="input-wrap">
    <input type="text" id="nome" placeholder="Seu nome"/>
    <span class="icone-input">🌸</span>
  </div>

  <div class="input-wrap">
    <input type="password" id="senha" placeholder="Qual Pokémon está na tela?"/>
    <span class="icone-input" id="olho" onclick="mostrarSenha()">🙈</span>
  </div>

  <button class="btn-login" onclick="entrar()">Entrar ✨</button>
</div>

<button class="voltar" onclick="location.href='index3.html'">Voltar</button>

<script>
function entrar(){
  if(document.getElementById('senha').value.toLowerCase()==='charizard'){
    location.href='index5.html';
  }else{
    alert('Senha errada 😭');
  }
}
function mostrarSenha(){
  const inp=document.getElementById('senha'),olho=document.getElementById('olho');
  if(inp.type==='password'){inp.type='text';olho.textContent='🙉';}
  else{inp.type='password';olho.textContent='🙈';}
}

const itens=['🌻','🌼','✨','💛','🌸'];
function criarPetal(){
  const el=document.createElement('div');el.className='petal';
  el.textContent=itens[Math.floor(Math.random()*itens.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.fontSize=(Math.random()*14+10)+'px';
  el.style.animationDuration=(Math.random()*3+5)+'s';
  document.body.appendChild(el);setTimeout(()=>el.remove(),8000);
}
setInterval(criarPetal,400);
</script>
</body>
</html>

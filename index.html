<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>E aí princesa 💖</title>
<link rel="stylesheet" href="style.css"/>
<style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; }

.entrada {
  position:relative;
  z-index:1;
  text-align:center;
  max-width:560px;
  width:90%;
  background: var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-borda);
  border-radius:var(--radius-card);
  box-shadow:var(--sombra);
  padding:52px 40px;
  animation: surgir 1.4s cubic-bezier(.22,1,.36,1) both;
}
.entrada::before {
  content:'';
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:60%;height:3px;
  background:linear-gradient(90deg,transparent,var(--amarelo),transparent);
  border-radius:50%;
}

@keyframes surgir {
  from { opacity:0; transform:translateY(40px); }
  to   { opacity:1; transform:translateY(0); }
}

.girassol-hero {
  font-size:4rem;
  margin-bottom:20px;
  display:block;
  animation:balanco 3s ease-in-out infinite;
}
@keyframes balanco {
  0%,100% { transform: rotate(-6deg) translateY(0); }
  50%      { transform: rotate(6deg) translateY(-8px); }
}

h1 {
  font-size:clamp(2rem,5vw,2.8rem);
  margin-bottom:10px;
  color:var(--text);
}

.subtitulo {
  font-size:1.1rem;
  color:var(--text-suave);
  margin-bottom:36px;
  text-align:center;
}

/* mascote Charmander canto */
.mascote {
  position:fixed;
  bottom:20px; right:20px;
  width:160px;
  animation:flutuar 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 16px rgba(74,55,40,.18));
  z-index:5;
}
@keyframes flutuar {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-12px); }
}
</style>
</head>
<body>

<div class="entrada">
  <span class="girassol-hero">🌻</span>
  <h1>E aí, princesa 💖</h1>
  <p class="subtitulo">Espero que você esteja bem.</p>
  <button class="btn" onclick="location.href='index2.html'">Continuar ✨</button>
</div>

<img src="charmander.png" class="mascote" alt="Charmander"/>

<script>
const itens = ['🌻','🌼','✨','💛','🌸'];
function criarPetal(){
  const el = document.createElement('div');
  el.className = 'petal';
  el.textContent = itens[Math.floor(Math.random()*itens.length)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.fontSize = (Math.random()*14+10) + 'px';
  el.style.animationDuration = (Math.random()*3+5) + 's';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 8000);
}
setInterval(criarPetal, 400);
</script>
</body>
</html>
